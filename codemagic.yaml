# Codemagic CI/CD — build iOS (flavor prod) y publicación a TestFlight
# App: Exchange Monitor (Flutter) · App Store App ID: 6757874770
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Requisitos en la UI de Codemagic:
#  - App Store Connect API key cargada con el nombre: EUGENIO_VALEIRAS_STORE
#    (rol App Manager o Admin, para poder crear certificados/profiles)
#  - Repo conectado: EugeValeiras/exchange-monitor-app

workflows:
  ios-testflight:
    name: iOS → TestFlight (prod)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Dispara el build automáticamente en cada push a main
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: EUGENIO_VALEIRAS_STORE

    environment:
      groups:
        - ios_signing          # contiene CERTIFICATE_PRIVATE_KEY (var segura, cargada en la UI)
      vars:
        APP_STORE_APP_ID: "6757874770"
        BUNDLE_ID: "com.eugeniovaleiras.exchangeMonitor"
        WIDGET_BUNDLE_ID: "com.eugeniovaleiras.exchangeMonitor.ExchangeWidget"
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/ios/Pods

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      # --- Code signing manual (crea cert + profiles si faltan) ---
      - name: Inicializar keychain
        script: keychain initialize

      - name: Fetch/crear signing files (app principal + widget)
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --platform IOS --type IOS_APP_STORE --create

      - name: Agregar certificados al keychain
        script: keychain add-certificates

      - name: Aplicar provisioning profiles al proyecto Xcode
        script: xcode-project use-profiles
      # ------------------------------------------------------------

      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \; || true

      - name: Calcular build number (último de TestFlight + 1)
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          BUILD_NUMBER=$(( LATEST + 1 ))
          echo "Último en TestFlight: $LATEST  ->  nuevo build: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      - name: Build IPA (release, flavor prod)
        script: |
          flutter build ipa --release \
            --flavor prod \
            -t lib/main_prod.dart \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Internal Testers
      email:
        recipients:
          - eugenio.valeiras@gmail.com
        notify:
          success: true
          failure: true
