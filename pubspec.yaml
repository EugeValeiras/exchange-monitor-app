name: exchange_monitor
description: "Exchange Monitor - Track your crypto portfolio"
publish_to: 'none'

version: 1.0.0+36

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.0

  # HTTP & WebSocket
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Charts
  fl_chart: ^0.69.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utils
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  package_info_plus: ^8.0.0

  # Passkeys/WebAuthn
  passkeys: ^2.17.4

  # iOS Widget
  home_widget: ^0.7.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/splash/

# Native Splash Screen Configuration
flutter_native_splash:
  color: "#0B0E11"
  image: assets/splash/logo.png
  color_dark: "#0B0E11"
  image_dark: assets/splash/logo.png

  # iOS - center the image at its natural size (no scaling)
  ios_content_mode: center

  android_12:
    color: "#0B0E11"
    image: assets/splash/logo.png
    color_dark: "#0B0E11"
    image_dark: assets/splash/logo.png
